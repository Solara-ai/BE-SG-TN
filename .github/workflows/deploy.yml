name: Build and Deploy Spring Boot App

on:
  push:
    branches:
      - dev  # Trigger workflow on push to the 'dev' branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Debug Build Process
        run: |
          set -x
          mvn clean install -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: be-sg-tn-jar
          path: target/BE-SG-TN-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build  # Deploy only after the build job is successful
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: be-sg-tn-jar
          path: .
          if-no-files-found: error

      - name: SSH into server and stop the application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Stopping the existing application..."
            sudo systemctl stop myapp || true  # Ignore error if service does not exist

            echo "Removing old JAR file..."
            rm -f /home/${{ secrets.SERVER_USER }}/BE-SG-TN-0.0.1-SNAPSHOT.jar

      - name: Transfer JAR file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "BE-SG-TN-0.0.1-SNAPSHOT.jar"
          target: "/root/java"

      - name: Start the application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting the application..."
            nohup java -jar /home/${{ secrets.SERVER_USER }}/BE-SG-TN-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

            echo "Deployment completed successfully!"
