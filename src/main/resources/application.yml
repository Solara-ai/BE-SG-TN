server:
  port: 8081
  servlet:
    context-path: ${CONTEXT_PATH}
spring:
  application:
    name: BE-SG-TN
  profiles:
    active: ${PROFILE}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${PASSWORD_EMAIL}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          port: 25
          auth: true
          starttls:
            enable: true
            required: true
          connectionTimeout: 5000
          sendTimeout: 3000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true
logging:
  level:
    root: info
    org:
      hibernate:
        SQL_SLOW: info
      springframework:
        security: ERROR
application:
  security:
    authentication:
      jwt:
        base64-secret: ${BASE64_SECRET_KEY}
        token-validity-in-seconds: 3600
        token-validity-in-seconds-for-remember-me: 2592000
        refresh-token-validity-in-seconds: 2592000
  cors:
    allowed-origins: '*'
    allowed-methods: '*'
    allowed-headers: '*'