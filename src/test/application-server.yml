spring:
  data:
    mongodb:
      authentication-database: ${DATABASE_DB}
      username: ${USERNAME_DB}
      password: ${PASSWORD_DB}
      database: ${DATABASE_DB}
      port: ${PORT_DB}
      host: ${HOST_DB_SERVER}
      auto-index-creation: true
  logging:
    level:
      org:
        springframework:
          data:
            mongodb: DEBUG